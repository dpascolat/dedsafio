plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"dedsafio4" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

repositories {
	maven { url "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// GeckoLib: el mob Soarer usa su modelo y sus animaciones. Hay que tenerlo instalado para jugar.
	modImplementation "software.bernie.geckolib:geckolib-fabric-1.21.1:4.9.2"

	// Solo para probar en el juego de desarrollo (no se incluye en el mod).
	def xaero = file("${System.getenv('APPDATA')}/.minecraft/mods/xaerominimap-fabric-1.21.1-26.5.0.jar")
	if (xaero.exists()) modLocalRuntime files(xaero)
	def xaeroLib = file("run/devmods/xaerolib-fabric-1.21.1-1.7.3.jar")   // viene adentro del de arriba
	if (xaeroLib.exists()) modLocalRuntime files(xaeroLib)
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
