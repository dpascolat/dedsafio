# Compila el mod cada vez que cambia el código y actualiza el dedsafio4.jar del repo
# y su sha1 en dedsafio.json, así el launcher baja la versión nueva.
# Si la compilación falla, no se toca nada (el launcher sigue con el jar anterior).
name: Compilar el mod

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "build.gradle"
      - "gradle.properties"
      - "settings.gradle"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compilar
  cancel-in-progress: false

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Actualizar dedsafio4.jar y dedsafio.json
        run: |
          JAR=$(ls build/libs/*.jar | grep -v -e '-sources' -e '-dev' | head -n 1)
          echo "Jar compilado: $JAR"
          cp "$JAR" dedsafio4.jar
          SHA1=$(sha1sum dedsafio4.jar | cut -d' ' -f1)
          python3 - "$SHA1" <<'PY'
          import json, sys
          # Se reemplaza sólo el sha1 viejo en el texto, para no cambiarle el formato al archivo.
          texto = open("dedsafio.json", encoding="utf-8", newline="").read()
          viejo = next(m["sha1"] for m in json.loads(texto)["mods"] if m["archivo"] == "dedsafio4.jar")
          open("dedsafio.json", "w", encoding="utf-8", newline="").write(texto.replace(viejo, sys.argv[1]))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dedsafio4.jar dedsafio.json
          if git diff --cached --quiet; then
            echo "No cambió nada."
          else
            git commit -m "Actualizar dedsafio4.jar (compilado automáticamente)"
            # Si otra compilación subió un jar mientras tanto, gana el de ésta (que es la más nueva).
            git pull --rebase --autostash -X theirs origin main
            git push origin HEAD:main
          fi
