# Prueba la versión NeoForge arrancándola de verdad: primero el servidor (hasta "Done") y después el juego con una
# pantalla virtual (hasta el menú principal). Muestra los errores y avisos del mod al cargar. Se corre a mano.
name: Probar el mod (NeoForge)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Servidor y juego conectado
        run: |
          chmod +x gradlew
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils imagemagick > /dev/null
          Xvfb :99 -screen 0 1280x720x24 > /dev/null 2>&1 &
          export DISPLAY=:99
          mkdir -p neoforge/run && echo "eula=true" > neoforge/run/eula.txt
          printf 'online-mode=false\nspawn-protection=0\nenforce-secure-profile=false\n' > neoforge/run/server.properties
          ./gradlew -p neoforge compileJava --no-daemon -q
          # El juego corre desde una copia (otra carpeta de juego y sin pelearse con el Gradle del servidor).
          cp -r neoforge neoforge-juego
          # Sin la pantalla de bienvenida de la primera vez (si no, no entra solo al servidor).
          mkdir -p neoforge-juego/run && printf 'onboardAccessibility:false\nnarrator:0\nskipMultiplayerWarning:true\njoinedFirstServer:true\n' > neoforge-juego/run/options.txt
          ./gradlew -p neoforge runServer --no-daemon > servidor.log 2>&1 &
          for i in $(seq 1 180); do
            if grep -qE 'Done \(|Crash report|Failed to start|BUILD FAILED' servidor.log; then break; fi
            sleep 5
          done
          echo "===== SERVIDOR =====" && (grep -E 'Done \(' servidor.log || echo "NO LLEGÓ A DONE")
          # El juego en otra carpeta (si no, pisa los archivos del servidor) y entrando directo al servidor.
          ./gradlew -p neoforge-juego runClient --no-daemon -PservidorPrueba=localhost:25565 > juego.log 2>&1 &
          for i in $(seq 1 60); do
            if grep -qE 'joined the game|Crash report|Game crashed|BUILD FAILED' servidor.log juego.log; then break; fi
            sleep 5
          done
          echo "===== CONEXIÓN =====" && (grep -E 'joined the game|logged in with entity' servidor.log || echo "NO ENTRÓ")
          mkdir -p /tmp/diag
          import -window root /tmp/diag/pantalla-1.png || true
          PID_JUEGO=""
          for p in $(pgrep java); do
            case "$(readlink /proc/$p/cwd)" in *neoforge-juego/run) PID_JUEGO=$p ;; esac
          done
          echo "Proceso del juego: $PID_JUEGO"
          [ -n "$PID_JUEGO" ] && jstack "$PID_JUEGO" > /tmp/diag/hilos-juego-1.txt 2>&1 || true
          sleep 90
          import -window root /tmp/diag/pantalla-2.png || true
          [ -n "$PID_JUEGO" ] && jstack "$PID_JUEGO" > /tmp/diag/hilos-juego-2.txt 2>&1 || true
          echo "===== EN EL MUNDO 90 SEGUNDOS ====="
          grep -nE 'Exception|ERROR|Crash|INYECCIÓN' servidor.log | cut -c1-300 | head -60
          pkill -f java || true
          pkill Xvfb || true

      - name: Código de NeoForge donde no encajan inyecciones
        if: always()
        run: |
          mkdir -p /tmp/diag
          JAR=neoforge/build/moddev/artifacts/neoforge-21.1.252.jar
          for c in net.minecraft.world.entity.LivingEntity net.minecraft.world.entity.projectile.ThrownEnderpearl; do
            javap -c -p -cp "$JAR" "$c" > "/tmp/diag/javap-$c.txt" 2>&1 || true
          done
          ls -la /tmp/diag

      - name: Subir los logs a la rama diagnostico-neoforge
        if: always()
        run: |
          mkdir -p /tmp/diag; cp servidor.log juego.log /tmp/diag/ 2>/dev/null || true
          cp neoforge/run/logs/*.log /tmp/diag/ 2>/dev/null || true
          cp neoforge-juego/run/logs/latest.log /tmp/diag/juego-latest.log 2>/dev/null || true
          cp neoforge-juego/run/crash-reports/*.txt neoforge/run/crash-reports/*.txt /tmp/diag/ 2>/dev/null || true
          cp neoforge/run/crash-reports/*.txt /tmp/diag/ 2>/dev/null || true
          cd /tmp/diag
          git init -q -b diagnostico-neoforge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Logs de la prueba NeoForge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico-neoforge
