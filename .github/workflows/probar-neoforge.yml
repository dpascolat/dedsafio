# Prueba la versión NeoForge arrancándola de verdad: primero el servidor (hasta "Done") y después el juego con una
# pantalla virtual (hasta el menú principal). Muestra los errores y avisos del mod al cargar. Se corre a mano.
name: Probar el mod (NeoForge)

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Servidor
        run: |
          chmod +x gradlew
          mkdir -p neoforge/run && echo "eula=true" > neoforge/run/eula.txt
          printf 'online-mode=false\nlevel-type=minecraft\\:flat\nspawn-protection=0\n' > neoforge/run/server.properties
          ./gradlew -p neoforge runServer --no-daemon > servidor.log 2>&1 &
          PID=$!
          for i in $(seq 1 180); do
            if grep -qE 'Done \(|Crash report|Exception in server tick loop|Failed to start|BUILD FAILED' servidor.log; then break; fi
            sleep 5
          done
          sleep 10
          kill $PID || true
          pkill -f 'net.neoforged' || true
          echo "===== RESULTADO SERVIDOR ====="
          grep -E 'Done \(' servidor.log || echo "NO LLEGÓ A DONE"
          echo "===== ERRORES Y AVISOS ====="
          grep -nE 'ERROR|Exception|Caused by|INYECCIÓN|dedsafio' servidor.log | head -150

      - name: Juego (pantalla virtual)
        if: always()
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb libgl1-mesa-dri mesa-utils > /dev/null
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p neoforge runClient --no-daemon > juego.log 2>&1 &
          for i in $(seq 1 180); do
            if grep -qE 'Sound engine started|Created: .*textures/atlas|Crash report|Game crashed|BUILD FAILED|Exception in thread "main"' juego.log; then break; fi
            sleep 5
          done
          sleep 40
          pkill -f 'xvfb-run' || true
          pkill -f 'net.neoforged' || true
          pkill -f 'java' || true
          echo "===== RESULTADO JUEGO ====="
          grep -E 'Sound engine started|Game crashed|Crash report' juego.log || echo "SIN SEÑALES"
          echo "===== ERRORES Y AVISOS ====="
          grep -nE 'ERROR|Exception|Caused by|INYECCIÓN|dedsafio' juego.log | head -200

      - name: Subir los logs a la rama diagnostico-neoforge
        if: always()
        run: |
          mkdir -p /tmp/diag && cp servidor.log juego.log /tmp/diag/ 2>/dev/null || true
          cp neoforge/run/logs/latest.log /tmp/diag/servidor-latest.log 2>/dev/null || true
          cp neoforge/run/crash-reports/*.txt /tmp/diag/ 2>/dev/null || true
          cd /tmp/diag
          git init -q -b diagnostico-neoforge
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Logs de la prueba NeoForge"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" diagnostico-neoforge
