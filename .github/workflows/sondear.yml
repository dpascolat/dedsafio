# Temporal: muestra las versiones disponibles de NeoForge, ModDevGradle, GeckoLib y Xaero para NeoForge 1.21.1.
name: Sondear versiones
on: workflow_dispatch
jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "== neoforge"; curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o "<version>21\.1\.[0-9]*</version>" | tail -3
          echo "== moddev"; curl -s https://maven.neoforged.net/releases/net/neoforged/moddev/net.neoforged.moddev.gradle.plugin/maven-metadata.xml | grep -o "<version>[^<]*</version>" | tail -5
          echo "== geckolib"; curl -s https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-neoforge-1.21.1/maven-metadata.xml | grep -o "<version>[^<]*</version>" | tail -4
          for p in geckolib xaeros-minimap; do echo "== modrinth $p"; curl -s "https://api.modrinth.com/v2/project/$p/version?loaders=%5B%22neoforge%22%5D&game_versions=%5B%221.21.1%22%5D" | python3 -c "import json,sys;d=json.load(sys.stdin);[print(v['version_number'],f['filename'],f['url'],f['hashes']['sha1']) for v in d[:2] for f in v['files'][:1]]"; done
          echo "== installer"; curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml | grep -o "<latest>[^<]*</latest>"
